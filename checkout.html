
<!DOCTYPE html>
<html>
<head>
    <title>Checkout | Golden Jewels</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">

    <style>
        body{
            background-color:#fff7fb;
            font-family:'Poppins', sans-serif;
        }

        .navbar{
            background-color:#ffc4dd;
        }

        .navbar-brand{
            font-family:'Playfair Display', serif;
            font-size:30px;
            font-weight:bold;
            color:#7a284e;
        }

        .nav-link{
            color:#7a284e;
            font-weight:bold;
        }

        h1, h2{
            font-family:'Playfair Display', serif;
            color:#7a284e;
        }

        .box{
            background-color:white;
            border-radius:20px;
            padding:25px;
            box-shadow:0 4px 12px rgba(255,150,190,.3);
        }

        .btn-pink{
            background-color:#ff8fc7;
            color:white;
            border:none;
        }

        .btn-pink:hover{
            background-color:#ff5fae;
            color:white;
        }

        .total-text{
            font-size:18px;
            font-weight:bold;
            color:#7a284e;
        }
    </style>
</head>

<body onload="showCart()">

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="main.html">Golden Jewels</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="main.html">Home</a>
            <a class="nav-link" href="rings.html">Rings</a>
            <a class="nav-link" href="necklaces.html">Necklaces</a>
            <a class="nav-link" href="earrings.html">Earrings</a>
            <a class="nav-link" href="checkout.html">Cart</a>
        </div>
    </div>
</nav>

<div class="container my-5">

    <h1 class="text-center mb-4">Checkout</h1>

    <div class="row g-4">

        <div class="col-md-6">
            <div class="box">
                <h2>Your Cart</h2>

                <div id="cartItems"></div>

                <hr>

                <p class="total-text">Subtotal: $<span id="subtotal">0.00</span></p>
                <p class="total-text">Tax: $<span id="tax">0.00</span></p>
                <p class="total-text">Total: $<span id="total">0.00</span></p>

                <button class="btn btn-pink mt-2" onclick="clearCart()">Clear Cart</button>
            </div>
        </div>

        <div class="col-md-6">
            <div class="box">
                <h2>Customer Information</h2>

                <form>
                    <label>Full Name</label>
                    <input type="text" class="form-control mb-3">

                    <label>Email</label>
                    <input type="email" class="form-control mb-3">

                    <label>Address</label>
                    <input type="text" class="form-control mb-3">

                    <label>Payment Method</label>
                    <select class="form-control mb-3">
                        <option>Choose one</option>
                        <option>Credit Card</option>
                        <option>Debit Card</option>
                        <option>Gift Card</option>
                    </select>

                    <button type="button" class="btn btn-pink" onclick="placeOrder()">
                        Purchase
                    </button>
                </form>

                <p id="orderMessage" class="mt-3 total-text"></p>
            </div>
        </div>

    </div>
</div>

<script>
function showCart() {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    let cartItems = document.getElementById("cartItems");

    cartItems.innerHTML = "";

    let subtotal = 0;

    for (let i = 0; i < cart.length; i++) {
        let itemTotal = cart[i].price * cart[i].quantity;
        subtotal = subtotal + itemTotal;

        cartItems.innerHTML +=
            "<p>" + cart[i].name + " - $" + cart[i].price +
            " x " + cart[i].quantity +
            " = $" + itemTotal.toFixed(2) + "</p>";
    }

    let tax = subtotal * 0.08;
    let total = subtotal + tax;

    document.getElementById("subtotal").innerHTML = subtotal.toFixed(2);
    document.getElementById("tax").innerHTML = tax.toFixed(2);
    document.getElementById("total").innerHTML = total.toFixed(2);
}

function clearCart() {
    localStorage.removeItem("cart");
    showCart();
}

function placeOrder() {
    document.getElementById("orderMessage").innerHTML =
        "Thank you for shopping at Golden Jewels!";
}
</script>

</body>
</html>
